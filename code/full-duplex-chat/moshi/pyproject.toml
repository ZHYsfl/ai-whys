[project]
name = "teaching-version-moshi"
version = "0.1.0"
description = "A data-flow-first full-duplex Moshi and Mimi implementation for learning"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "LICENSES/*"]
requires-python = ">=3.10,<3.13"
dependencies = [
    "huggingface-hub>=0.24,<2.0",
    "numpy>=1.26,<2.3",
    "safetensors>=0.4,<1.0",
    "sentencepiece>=0.2,<1.0",
    "soundfile>=0.12,<1.0",
    "teaching-version-codec",
    "torch>=2.8,<2.10",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[tool.uv.sources]
teaching-version-codec = { path = "../../codec", editable = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
